name: CI

# The web app is pure Python - no nodejs, no build step. The gate is the
# test suite plus a check that the app actually starts and serves its
# four pages.
#
# The suite never touches the real asset library: every test gets a
# temporary plugin root.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run the suite
        shell: bash
        run: python -m pytest tests/ -q

      - name: The app starts and serves its pages
        shell: bash
        run: |
          python - <<'PY'
          import os, tempfile, pathlib
          # An empty plugin root: the pages must serve even with no library.
          root = pathlib.Path(tempfile.mkdtemp()) / "plugin"
          (root / "asset_library" / "characters").mkdir(parents=True)
          os.environ["MIE_PLUGIN_ROOT"] = str(root)
          os.environ["MIE_LLM_KEYS_FILE"] = str(root / "mie_llm_keys.json")
          os.environ["MIE_WEB_SETTINGS"] = str(root / "settings.json")
          from app.flask_app import create_app
          client = create_app().test_client()
          for path in ("/", "/llm", "/assets", "/scripts", "/video"):
              response = client.get(path)
              assert response.status_code == 200, (path, response.status_code)
              print("  OK", path)
          PY
